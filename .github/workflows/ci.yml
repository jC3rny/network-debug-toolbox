name: ci

# Validation for pull requests — build, scan, file-caps guard, helm lint. No push.
# Make this the required status check for `main` (name: "validate / build-scan").

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
