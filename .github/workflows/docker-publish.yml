name: docker-publish

# Build the hardened image, run the same gate as `make` (Trivy config + image scan,
# file-caps check), then push multi-arch to BOTH Docker Hub and GHCR on `main`/`v*`.
# The Helm chart is packaged and published to both registries too. Pull requests
# build + scan only (no push). A weekly rebuild keeps CVEs low as the Wolfi base is
# refreshed upstream.
#
# Published artifacts:
#   image  -> docker.io/<DOCKERHUB_USERNAME>/network-debug-toolbox
#             ghcr.io/<owner>/network-debug-toolbox
#   chart  -> ghcr.io/<owner>/charts/network-debug-toolbox
#             docker.io/<DOCKERHUB_USERNAME>/network-debug-toolbox-helm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — periodic rebuild
  workflow_dispatch:

env:
  IMAGE_NAME: network-debug-toolbox
  CHART_DIR: helm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push image to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1) Build a single-arch image, loaded into the local docker, for scanning + caps check.
      - name: Build (amd64) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — Dockerfile misconfig (fail on HIGH/CRITICAL)
        run: |
          # Skip helm/ — the chart's hostNetwork/hostPID/caps are intentional for a
          # debug tool and are validated separately by `helm lint`.
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs helm .

      - name: Trivy — image vulns (fail on fixed HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_NAME:ci"

      - name: Verify tcpdump file caps (non-root capture guard)
        run: |
          out=$(docker run --rm "$IMAGE_NAME:ci" sh -c 'getcap "$(command -v tcpdump)"')
          echo "$out"
          echo "$out" | grep -q cap_net_raw || { echo "FAIL: tcpdump missing file caps"; exit 1; }
          echo "OK: tcpdump file caps present"

      - name: Lowercase repository owner (ghcr paths must be lowercase)
        id: owner
        run: echo "ghcr=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # 2) Push multi-arch to both registries — only outside PRs (fork PRs have no secrets).
      - name: Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ steps.owner.outputs.ghcr }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64, linux/arm64) to Docker Hub + GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub Overview in sync with README.md (main only).
      - name: Sync README to Docker Hub overview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}

  # Package the Helm chart, push it to GHCR (nested charts/ path), then mirror the exact
  # same artifact to a separate Docker Hub repo (<name>-helm). Runs after the image
  # publishes, never on PRs.
  publish-chart:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push OCI chart to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package & push chart (GHCR + Docker Hub)
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ver=$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}')
          echo "chart version: $ver"

          # Registry logins (helm push to GHCR; oras copy GHCR -> Docker Hub).
          echo "$GHCR_TOKEN"      | helm registry login ghcr.io           -u "$ACTOR"              --password-stdin
          echo "$GHCR_TOKEN"      | oras login          ghcr.io           -u "$ACTOR"              --password-stdin
          echo "$DOCKERHUB_TOKEN" | oras login          registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          # Package once; push canonical chart to GHCR (leaf = chart name).
          helm package "$CHART_DIR" --destination dist
          chart=$(ls dist/*.tgz)
          helm push "$chart" "oci://ghcr.io/$owner/charts"

          # Mirror the identical artifact to a separate Docker Hub repo (-helm suffix).
          # oras cp preserves the Helm OCI media types; no repackaging/renaming needed.
          oras cp "ghcr.io/$owner/charts/${IMAGE_NAME}:${ver}" \
                  "registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm:${ver}"

          echo "chart -> oci://ghcr.io/$owner/charts/${IMAGE_NAME}:${ver}"
          echo "chart -> oci://registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm:${ver}"
