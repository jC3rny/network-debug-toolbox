name: docker-publish

# Build the hardened image, run the same gate as `make` (Trivy config + image scan,
# file-caps check), then push multi-arch to Docker Hub on `main` and on `v*` tags.
# Pull requests build + scan only (no push). A weekly rebuild keeps CVEs low as the
# Wolfi base is refreshed upstream.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — periodic rebuild
  workflow_dispatch:

env:
  IMAGE_NAME: network-debug-toolbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1) Build a single-arch image, loaded into the local docker, for scanning + caps check.
      - name: Build (amd64) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — Dockerfile misconfig (fail on HIGH/CRITICAL)
        run: |
          # Skip helm/ — the chart's hostNetwork/hostPID/caps are intentional for a
          # debug tool and are validated separately by `helm lint`.
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs helm .

      - name: Trivy — image vulns (fail on fixed HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_NAME:ci"

      - name: Verify tcpdump file caps (non-root capture guard)
        run: |
          out=$(docker run --rm "$IMAGE_NAME:ci" sh -c 'getcap "$(command -v tcpdump)"')
          echo "$out"
          echo "$out" | grep -q cap_net_raw || { echo "FAIL: tcpdump missing file caps"; exit 1; }
          echo "OK: tcpdump file caps present"

      # 2) Push multi-arch — only outside pull requests (secrets aren't available to fork PRs).
      - name: Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (linux/amd64, linux/arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub Overview in sync with README.md (main only).
      - name: Sync README to Docker Hub overview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}

  # Package the Helm chart and push it as an OCI artifact to GHCR. Runs only after the
  # image publishes (so the chart's default image is available), and never on PRs.
  publish-chart:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push OCI chart to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm

      - name: Package & push chart to GHCR (OCI)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package helm --destination dist
          chart=$(ls dist/*.tgz)
          helm push "$chart" "oci://ghcr.io/$owner/charts"
          echo "Pushed $chart -> oci://ghcr.io/$owner/charts/${{ env.IMAGE_NAME }}"
