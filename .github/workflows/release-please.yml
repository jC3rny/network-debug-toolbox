name: release-please

# Maintains a "release PR" (version + CHANGELOG.md + chart version/appVersion) from
# Conventional Commits, using GITHUB_TOKEN (no PAT). You merge that PR when you want to cut
# a release. On merge, release-please creates the GitHub Release + vX.Y.Z tag, and the
# publish job below calls release.yml to publish the versioned, signed artifacts.
#
# NOTE: because the release PR is created with GITHUB_TOKEN, CI does not auto-run on it.
# Merge it with the admin "merge without waiting for requirements" option, or close/reopen
# it once to trigger CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version (strip leading v)
        id: ver
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # When a release was cut, publish the versioned image + chart in this same run (the merge
  # push is a real trigger, so no PAT is needed to reach the publish workflow).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
