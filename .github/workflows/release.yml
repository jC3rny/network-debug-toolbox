name: release

# Validate, then publish image + Helm chart to BOTH Docker Hub and GHCR.
#   push to main  -> :latest (+ branch/sha tags)
#   push v* tag   -> semver tags
#   weekly cron   -> rebuild :latest (picks up base-image fixes)
#
# Published artifacts:
#   image  -> docker.io/<DOCKERHUB_USERNAME>/network-debug-toolbox
#             ghcr.io/<owner>/network-debug-toolbox
#   chart  -> ghcr.io/<owner>/helm-charts/network-debug-toolbox
#             docker.io/<DOCKERHUB_USERNAME>/network-debug-toolbox-helm

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — periodic rebuild
  workflow_dispatch:

env:
  IMAGE_NAME: network-debug-toolbox
  CHART_DIR: helm

jobs:
  # Run the exact same gate as PRs before anything is published.
  validate:
    uses: ./.github/workflows/validate.yml

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push image to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Lowercase repository owner (ghcr paths must be lowercase)
        id: owner
        run: echo "ghcr=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ steps.owner.outputs.ghcr }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64, linux/arm64) to Docker Hub + GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub overview
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}

  publish-chart:
    needs: [validate, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push OCI chart to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - name: Package & push chart (GHCR + Docker Hub)
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ver=$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}')
          echo "chart version: $ver"

          # Registry logins (helm push to GHCR; oras copy GHCR -> Docker Hub).
          echo "$GHCR_TOKEN"      | helm registry login ghcr.io              -u "$ACTOR"              --password-stdin
          echo "$GHCR_TOKEN"      | oras login          ghcr.io              -u "$ACTOR"              --password-stdin
          echo "$DOCKERHUB_TOKEN" | oras login          registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          # Package once; push canonical chart to GHCR (leaf = chart name).
          helm package "$CHART_DIR" --destination dist
          chart=$(ls dist/*.tgz)
          helm push "$chart" "oci://ghcr.io/$owner/helm-charts"

          # Mirror the identical artifact to a separate Docker Hub repo (-helm suffix).
          # oras cp preserves the Helm OCI media types; no repackaging/renaming needed.
          oras cp "ghcr.io/$owner/helm-charts/${IMAGE_NAME}:${ver}" \
                  "registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm:${ver}"

          echo "chart -> oci://ghcr.io/$owner/helm-charts/${IMAGE_NAME}:${ver}"
          echo "chart -> oci://registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm:${ver}"
