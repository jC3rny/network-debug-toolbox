name: release

# Publish the image (+ chart on releases) to Docker Hub and GHCR, signed with cosign.
#   push to main / weekly / dispatch -> image :latest (patch delivery; no chart)
#   workflow_call with a version      -> image :<version> + :latest AND the chart (release)
#
# The versioned path is driven by release-please.yml (it calls this workflow with the new
# version when a release PR is merged), so no PAT/tag-trigger is needed.
#
# Published artifacts:
#   image  -> docker.io/<DOCKERHUB_USERNAME>/network-debug-toolbox
#             ghcr.io/<owner>/library/network-debug-toolbox
#   chart  -> ghcr.io/<owner>/helm/network-debug-toolbox
#             docker.io/<DOCKERHUB_USERNAME>/network-debug-toolbox-helm

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — periodic rebuild
  workflow_dispatch:
    inputs:
      version:
        description: Semver to publish (empty = :latest only, no chart)
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        description: Semver to publish (empty = :latest only, no chart)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: network-debug-toolbox
  CHART_DIR: helm

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push image to ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3

      - name: Lowercase repository owner (ghcr paths must be lowercase)
        id: owner
        run: echo "ghcr=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # ---------- Docker Hub ----------
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub metadata
        id: meta-dockerhub
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,format=short

      - name: Build & push image to Docker Hub (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Docker Hub image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}@${DIGEST}"

      - name: Sync README to Docker Hub overview
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}

      # ---------- GHCR ----------
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR metadata
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.ghcr }}/library/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,format=short

      - name: Copy image to GHCR (no rebuild — same digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta-ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          src="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}@${DIGEST}"
          args=$(printf '%s\n' "$TAGS" | sed 's/^/--tag /')
          docker buildx imagetools create $args "$src"

      - name: Sign GHCR image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ steps.owner.outputs.ghcr }}/library/${IMAGE_NAME}@${DIGEST}"

  # Chart is published only on a release (workflow_call with a version).
  publish-chart:
    needs: [validate, publish-image]
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push OCI chart to ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - uses: sigstore/cosign-installer@v3

      - name: Package, push & sign chart (GHCR + Docker Hub)
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ver=$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}')
          echo "chart version: $ver"

          # Logins for helm push (GHCR) and cosign signatures (both). oras cp gets its
          # credentials inline (below) — it does not reliably use logged-in creds for a
          # cross-registry copy, which is what caused the Docker Hub 401.
          echo "$GHCR_TOKEN"      | helm registry login ghcr.io              -u "$ACTOR"              --password-stdin
          echo "$GHCR_TOKEN"      | cosign login        ghcr.io              -u "$ACTOR"              --password-stdin
          echo "$DOCKERHUB_TOKEN" | cosign login        registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          # Package once; push canonical chart to GHCR (leaf = chart name), capture its digest.
          helm package "$CHART_DIR" --destination dist
          chart=$(ls dist/*.tgz)
          helm push "$chart" "oci://ghcr.io/$owner/helm" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          [ -n "$digest" ] || { echo "could not resolve pushed chart digest"; exit 1; }

          # Mirror the identical artifact to a separate Docker Hub repo (-helm suffix),
          # passing per-endpoint credentials explicitly (robust cross-registry copy).
          oras cp \
            --from-username "$ACTOR"              --from-password "$GHCR_TOKEN" \
            --to-username   "$DOCKERHUB_USERNAME" --to-password   "$DOCKERHUB_TOKEN" \
            "ghcr.io/$owner/helm/${IMAGE_NAME}:${ver}" \
            "registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm:${ver}"

          # Sign both by the (shared) digest.
          cosign sign --yes "ghcr.io/$owner/helm/${IMAGE_NAME}@${digest}"
          cosign sign --yes "registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm@${digest}"

          echo "chart -> oci://ghcr.io/$owner/helm/${IMAGE_NAME}:${ver} ($digest)"
          echo "chart -> oci://registry-1.docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}-helm:${ver}"
